[options]
workdir = {root}/r
platforms = linux-x64, linux-arm64, macos-arm64, windows-x64
tools = r
publish = both

[build]
install =
    R CMD INSTALL --no-multiarch --with-keep.source .

[publish]
artifact =
    R CMD build .
final =
    R CMD build .
    R CMD check --no-manual --no-vignettes ntgcalls_{version}.tar.gz
